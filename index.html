<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>超次元オセロ</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/card.css" />
    <link rel="stylesheet" href="css/neon.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <div id="game-container">
      <!--ターン開始時の演出、後からやる-->
      <div id="turn-overlay" class="turn-overlay" hidden>
        <div class="turn-banner">
          <span id="turn-banner-text"></span>
          <span id="turn-number"></span>
        </div>
      </div>

      <!-- 相手のプレイヤー情報 -->

      <div class="board-area">
        <div id="opponent-hand"></div>
        <div class="player-info" id="top-player-info">
          <div class="player-details">
            <span class="player-piece" id="top-player-piece"></span>

            <div class="player-text">
              <span class="player-piece-count" id="top-piece-count"></span>
            </div>
          </div>

          <div class="hand-count">
            <img src="assets/cards.svg" class="hand-count-icon" alt="手札" />
            <span id="top-hand-count">0/7</span>
          </div>
        </div>

        <!-- パスとかのゲームのメッセージ -->
        <p id="game-message"></p>

        <!-- 盤面 -->
        <div id="board"></div>

        <!-- 自分のプレイヤー情報 -->
        <div class="player-info" id="bottom-player-info">
          <div class="player-details">
            <span class="player-piece" id="bottom-player-piece"></span>

            <div class="player-text">
              <span class="player-piece-count" id="bottom-piece-count"></span>
            </div>
          </div>

          <div class="hand-count">
            <img src="assets/cards.svg" class="hand-count-icon" alt="手札" />
            <span id="bottom-hand-count">0/7</span>
          </div>
        </div>

        <!-- 手札 -->
        <div class="hand-scroll">
          <button
            id="hand-prev"
            class="carousel-arrow"
            type="button"
            aria-label="手札を左にスクロール"
            disabled
          >
            ‹
          </button>

          <div id="card-hand"></div>

          <button
            id="hand-next"
            class="carousel-arrow"
            type="button"
            aria-label="手札を右にスクロール"
            disabled
          >
            ›
          </button>
        </div>
      </div>

      <div class="game-buttons">
        <!-- リセットボタン -->
        <button id="resetButton">もう一度遊ぶ</button>
        <!-- ターン終了ボタン -->
        <button id="endTurnButton">ターン終了</button>
      </div>
    </div>

    <!-- カード詳細モーダル -->
    <div
      id="card-modal"
      class="card-selection-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="card-modal-name"
      hidden
    >
      <div class="selected-card-preview" id="card-modal-preview">
        <button
          type="button"
          class="card-preview-close"
          id="card-modal-close"
          aria-label="カード詳細を閉じる"
        >
          ×
        </button>

        <div class="card-preview-kicker" id="card-modal-type"></div>

        <div class="card-preview-art">
          <div class="card-preview-orbit"></div>

          <img id="card-modal-icon" class="card-modal-icon" alt="" />
        </div>

        <div class="card-preview-copy">
          <h2 id="card-modal-name"></h2>
          <p id="card-modal-description"></p>
        </div>

        <div class="card-preview-actions">
          <button
            type="button"
            class="card-preview-cancel"
            id="card-modal-cancel"
          >
            戻る
          </button>

          <button
            type="button"
            class="card-preview-confirm"
            id="card-modal-use"
          >
            カードを使用
          </button>
        </div>
      </div>
    </div>

    <script src="js/cardData.js"></script>
    <script src="js/cardEffects.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/cardUI.js"></script>
    <script src="js/script.js"></script>
    <script src="js/cardModal.js"></script>
  </body>
</html>
